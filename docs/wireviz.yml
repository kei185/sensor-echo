connectors:
  YLidar:
    type: D-Sub
    subtype: JST GH-1.25 female
    pinlabels: [RX,GND, TX,  5V ]
  # DRV8835:
  #   type: Molex KK 254
  #   subtype: Dupont female
  #   pinlabels: [VM,VCC, MODE, GND, xIN1, xIN2, xOUT1, xOUT2]
  # FIT0483:
  #   type: Molex KK 254
  #   subtype: JST ZH?-1.5 female 
  #   pinlabels: [M1, GND, C1, C2, VCC-6V , M2]
  STM32:
    type: Molex KK 254
    subtype: Dupont male 
    pinlabels: [GPIO, GND]

  GND:
    type: Dupont female 
    pinlabels: [GND]
  # 5V-power:
  #   type: female
  #   pinlabels: [5V]
  # 6V-power:
  #   type: Dupont female 
  #   pincaount: [5V]

connections:
  - 
    - YLidar: [RX, TX]
    - GPIO: [GPIO]
    - STM32: [GPIO]
  - 
    - YLidar: [GND]
    - STM32: [GND]
    - GND: [GND]
 

cables:
  W-GPIO:
    wirecount: 1 
    colors: [WH]
  W-GND:
    wirecount: 1
    gauge: 0.25 mm2
    colors: [BK]
  


